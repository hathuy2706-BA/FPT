<rect x="115" y="467" width="38" height="15" rx="7" fill="#1f4e78"/>
<text x="134" y="478" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">S-02</text>

<!-- Front-End Validation -->
<rect x="589" y="545" width="290" height="58" rx="9" fill="#ffffff" stroke="#2e75b6" stroke-width="1.8"/>
<text x="734" y="570" font-size="12.5" fill="#1a1a1a" text-anchor="middle"><tspan x="734" dy="0">Kiểm tra ràng buộc chống xung đột</tspan><tspan x="734" dy="16">(trùng Cam khác Cloud / trùng SA chu kỳ)</tspan></text>

<!-- Gateway Xung Đột -->
<polygon points="734,635 760,661 734,687 708,661" fill="#fff2cc" stroke="#bf8f00" stroke-width="2"/>
