<!-- S-03 & S-04 -->
<rect x="109" y="865" width="290" height="58" rx="9" fill="#ffffff" stroke="#1f4e78" stroke-width="1.8"/>
<text x="254" y="890" font-size="12.5" fill="#1a1a1a" text-anchor="middle"><tspan x="254" dy="0">Bấm 'Tiến hành đặt hàng' (Checkout)</tspan><tspan x="254" dy="16">với nhóm sản phẩm đã tick chọn</tspan></text>
<rect x="115" y="857" width="38" height="15" rx="7" fill="#1f4e78"/>
<text x="134" y="868" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">S-04</text>

