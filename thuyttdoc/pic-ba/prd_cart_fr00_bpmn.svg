<text x="737.0" y="32" font-size="18.5" font-weight="bold" fill="#1f4e78" text-anchor="middle">SƠ ĐỒ BPMN — FR00 · QUY TẮC NỀN TẢNG GIỎ HÀNG (SELECTION · DELETION · ORDER LIFECYCLE)</text>
<text x="737.0" y="55" font-size="12" fill="#595959" font-style="italic" text-anchor="middle">Liên kết: 8.00.1 Business Rules (BR-01 → BR-05) · 8.00.3 Các bước (S-01 → S-05) · 8.00.5 Mã lỗi ERR-CART / WRN-CART</text>

