<rect x="589" y="990" width="290" height="58" rx="9" fill="#ffffff" stroke="#2e75b6" stroke-width="1.8"/>
<text x="734" y="1013" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="734" dy="0">CLEAR các SP đã tạo đơn khỏi giỏ;</tspan><tspan x="734" dy="15">GIỮ NGUYÊN các SP chưa tick chọn &amp;</tspan><tspan x="734" dy="15">cập nhật lại Badge Header (BR-05)</tspan></text>
<rect x="595" y="982" width="38" height="15" rx="7" fill="#2e75b6"/>
<text x="614" y="993" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">S-05</text>

