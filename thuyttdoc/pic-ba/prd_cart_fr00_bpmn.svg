<text x="614" y="730" font-size="11.5" fill="#c62828" font-weight="bold" text-anchor="middle"><tspan x="614" dy="0">Xung đột: Cảnh báo Warning</tspan><tspan x="614" dy="15">inline &amp; Tự động Bỏ tick (BR-04)</tspan></text>

